[package]
name = "rs-repository-utils"
version = "0.2.0"
edition = "2024"

[features]
default = []
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:tokio"]
redis = ["dep:redis", "dep:tokio"]
health = ["dep:tokio", "dep:serde"]
full = ["postgres", "redis", "health"]

[dependencies]
failsafe = "1.3.0"
tracing = "0.1"

serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["time", "rt"], optional = true }

deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", optional = true }

redis = { version = "1.0", features = ["tokio-comp", "connection-manager"], optional = true }
